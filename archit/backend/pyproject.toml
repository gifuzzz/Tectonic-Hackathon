[project]
name = "sdworx-knowledge-backend"
version = "0.1.0"
description = "Django backend: Google Drive sync, enrichment, search, trust rules and conflict detection"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.5.0",
    "openai>=1.50",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[tool.uv]
package = false
